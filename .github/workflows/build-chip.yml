name: Build CHIP Android SO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git gcc g++ ninja-build python3 python3-pip unzip zip curl libssl-dev

      - name: Clone CHIP
        run: |
          git clone https://github.com/project-chip/connectedhomeip.git
          cd connectedhomeip
          git checkout v1.5.1.0
          git submodule update --init --recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup environment
        run: |
          cd connectedhomeip
          source scripts/activate.sh --disable-pigweed --no-bootstrap

      # ✅ Java（必须）
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Android SDK（必须）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 安装 NDK
      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # GN
      - name: Install GN
        run: |
          git clone https://gn.googlesource.com/gn
          cd gn
          python3 build/gen.py
          ninja -C out
          echo "$PWD/out" >> $GITHUB_PATH
        
      - name: Setup Android NDK
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/android-ndk-r25c" >> $GITHUB_ENV

      - name: Fetch Android deps
        run: |
          cd connectedhomeip
          bash scripts/setup/android_deps.sh

      - name: Build CHIP
        run: |
          cd connectedhomeip
          
          # ❗关键1：删除旧构建缓存
          rm -rf out/android-arm64

          # ❗关键2：不要用 activate.sh（避免自动脚本）
          # source scripts/activate.sh
          export CHIP_NO_ACTIVATE=1

          # 修补 Java 依赖
          sed -i '/src\/platform\/Linux/d' src/controller/java/BUILD.gn
                    
          gn gen out/android-arm64 --args='
            target_os="android"
            target_cpu="arm64"
            android_ndk_root="'$ANDROID_NDK_HOME'"
            android_sdk_root="'$ANDROID_HOME'"
            matter_enable_java_compilation=true
            is_debug=false
            chip_device_platform="android"
          '
          ninja -C out/android-arm64
          # ❗关键：只编 controller
          # ninja -C out/android-arm64 chip-controller
          # ❗关键：只编 controller（绕开 root BUILD）
          # ninja -C out/android-arm64 //src/controller:chip-controller

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: chip-so
          path: |
            connectedhomeip/out/android-arm64/libCHIPController.so
            connectedhomeip/out/android-arm64/libSetupPayloadParser.so
            connectedhomeip/out/android-arm64/libc++_shared.so
