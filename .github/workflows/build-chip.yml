name: Build CHIP Android SO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git gcc g++ ninja-build python3 python3-pip unzip zip curl libssl-dev

      - name: Clone CHIP
        run: |
          git clone https://github.com/project-chip/connectedhomeip.git
          cd connectedhomeip
          git checkout v1.5.1.0
          git submodule update --init --recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup environment
        run: |
          cd connectedhomeip
          source scripts/activate.sh --disable-pigweed --no-bootstrap

      # ✅ Java（必须）
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Android SDK（必须）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 安装 NDK
      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # GN
      - name: Install GN
        run: |
          git clone https://gn.googlesource.com/gn
          cd gn
          python3 build/gen.py
          ninja -C out
          echo "$PWD/out" >> $GITHUB_PATH
        
      - name: Setup Android NDK
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/android-ndk-r25c" >> $GITHUB_ENV

      - name: Fetch Android deps
        run: |
          cd connectedhomeip
          mkdir -p third_party/android_deps/artifacts
          cd third_party/android_deps/artifacts
          # annotation
          wget https://maven.aliyun.com/repository/google/androidx/annotation/annotation/1.1.0/annotation-1.1.0.jar

      - name: Prepare java_deps
        run: |
          cd connectedhomeip
          mkdir -p third_party/java_deps/artifacts
          cd third_party/java_deps/artifacts
          # jsr305
          curl -L -O https://maven.aliyun.com/repository/central/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar
          # guava
          curl -L -O https://maven.aliyun.com/repository/central/com/google/guava/guava/31.1-android/guava-31.1-android.jar
          # checker annotations
          curl -L -O https://maven.aliyun.com/repository/central/org/checkerframework/checker-qual/3.12.0/checker-qual-3.12.0.jar
          # error
          curl -L -O https://maven.aliyun.com/repository/central/com/google/errorprone/error_prone_annotations/2.11.0/error_prone_annotations-2.11.0.jar
          # json
          curl -L -O https://maven.aliyun.com/repository/central/org/json/json/20220924/json-20220924.jar
          # gson
          curl -L -O https://maven.aliyun.com/repository/central/com/google/code/gson/gson/2.9.1/gson-2.9.1.jar
          # protobuf-java
          curl -L -O https://maven.aliyun.com/repository/central/com/google/protobuf/protobuf-java/3.22.0/protobuf-java-3.22.0.jar
          # kotlin-stdlib
          curl -L -O https://maven.aliyun.com/repository/central/org/jetbrains/kotlin/kotlin-stdlib/1.8.20/kotlin-stdlib-1.8.20.jar
          # kotlin-test
          curl -L -O https://maven.aliyun.com/repository/central/org/jetbrains/kotlin/kotlin-stdlib/1.8.20/kotlin-test-1.8.20.jar
          # kotlinx-coroutines-core-jvm
          curl -L -O https://maven.aliyun.com/repository/central/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.7.3/kotlinx-coroutines-core-jvm-1.7.3.jar
          # Truth + Guava
          curl -L -O https://maven.aliyun.com/repository/central/com/google/truth/truth/1.1.3/truth-1.1.3.jar
          curl -L -O https://maven.aliyun.com/repository/central/com/google/guava/guava/31.1-android/guava-31.1-android.jar
          curl -L -O https://maven.aliyun.com/repository/central/com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar
          curl -L -O https://maven.aliyun.com/repository/central/com/google/guava/listenablefuture/9999.0-empty-to-avoid-conflict-with-guava/listenablefuture-9999.0-empty-to-avoid-conflict-with-guava.jar
          # JUnit
          curl -L -O https://maven.aliyun.com/repository/central/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -O https://maven.aliyun.com/repository/central/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Force disable Kotlin Werror
        run: |
          cd connectedhomeip      
          cat > build/chip/java/kotlinc_runner.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess
          import sys
          
          def main():
              args = sys.argv[1:]
          
              # 🔥 强制过滤掉所有坑参数
              filtered = []
              for a in args:
                  if a in ("-Werror", "-Xlint:all"):
                      continue
                  filtered.append(a)
          
              cmd = ["/usr/bin/kotlinc"] + filtered
              print("RUN:", " ".join(cmd))
              return subprocess.call(cmd)
          
          if __name__ == "__main__":
              sys.exit(main())
          EOF

      - name: Build CHIP
        run: |
          cd connectedhomeip
          source scripts/activate.sh                    
          gn gen out/android-arm64 --args='
            target_os="android"
            target_cpu="arm64"
            android_ndk_root="'$ANDROID_NDK_HOME'"
            android_sdk_root="'$ANDROID_HOME'"
            matter_enable_java_compilation=true
            is_debug=false
            chip_device_platform="android"
          '
          ninja -C out/android-arm64

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: chip-so
          path: |
            connectedhomeip/out/android-arm64/libCHIPController.so
            connectedhomeip/out/android-arm64/libSetupPayloadParser.so
            connectedhomeip/out/android-arm64/libc++_shared.so
