name: Build Examples CHIP Android SO (Test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      NDK_VERSION: 28.2.13676358
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_PLATFORM: android-34
      ANDROID_BUILD_TOOLS: 34.0.0

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git gcc g++ ninja-build python3 python3-pip unzip curl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check Python
        run: |
          which python
          python --version

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Fake Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Kotlin
        run: |
          wget https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip kotlin-compiler-2.1.0.zip -d kotlin
          echo "$PWD/kotlin/kotlinc/bin" >> $GITHUB_PATH
          kotlinc -version

      - name: Install NDK (if needed)
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            sdkmanager "ndk;${NDK_VERSION}"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Install GN (prebuilt)
        run: |
          curl -L -o gn.zip https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest
          unzip gn.zip -d gn-bin
          chmod +x gn-bin/gn
          echo "$PWD/gn-bin" >> $GITHUB_PATH
    
      # - name: Fetch Android deps
      #   env:
      #     PW_PROJECT_ROOT: ${{ github.workspace }}
      #     CHIP_ROOT: ${{ github.workspace }}
      #   run: |
      #     cd $GITHUB_WORKSPACE
      #     python third_party/android_deps/set_up_android_deps.py
      #     cd third_party/android_deps
      #     chmod +x gradlew
      #     ./gradlew setUpAndroidDeps
      #     ls -R artifacts

      # - name: Install minimal Python deps
      #   run: |
      #     python -m pip install --upgrade pip
      #     python -m pip install \
      #       click \
      #       colorama \
      #       coloredlogs \
      #       jinja2 \
      #       lark \
      #       pyyaml \
      #       rich \
      #       stringcase \
      #       diskcache \
      #       matter-idl
      #     echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts/py_matter_idl:$GITHUB_WORKSPACE/scripts/tools" >> $GITHUB_ENV

      - name: Create Pigweed override
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build_overrides
          cat > build_overrides/pigweed_environment.gni <<EOF
          pw_env_setup_CIPD_INSTALL_DIR = ""
          EOF
          ls -l build_overrides

      - name: Export LDFLAGS
        run: |
          echo 'LDFLAGS=-Wl,-z,max-page-size=16384' >> $GITHUB_ENV

      - name: Remove Kotlin Werror
        run: |
          cd $GITHUB_WORKSPACE
          grep -R "-Werror" build src | head
          find build src -type f \( -name "*.gni" -o -name "*.gn" -o -name "*.py" \) \
            -exec sed -i 's/"-Werror",//g' {} \;
          find build src -type f \( -name "*.gni" -o -name "*.gn" -o -name "*.py" \) \
            -exec sed -i 's/"-Xlint:all",//g' {} \;

      # - name: Force Kotlin 2.3
      #   run: |
      #     cd $GITHUB_WORKSPACE/examples/android/CHIPTool
      #     find . -type f | xargs sed -i 's/2\.1\.0/2.3.0/g'
      #     find . -type f | xargs sed -i 's/2\.2\.0/2.3.0/g'
      #     find . -type f | xargs sed -i 's/2\.0\.21/2.3.0/g'
      #     grep -R "2.3.0" .
      
      - name: Build CHIPTool
        env:
          PW_PROJECT_ROOT: ${{ github.workspace }}
          CHIP_ROOT: ${{ github.workspace }}
        run: |
          echo $PW_PROJECT_ROOT
          echo $CHIP_ROOT
          cd $GITHUB_WORKSPACE

          source scripts/bootstrap.sh
          source scripts/activate.sh
          
          python scripts/build/build_examples.py --target android-arm64-chip-tool build

      - name: Find so
        run: |
          find . -name "*.so"
     
