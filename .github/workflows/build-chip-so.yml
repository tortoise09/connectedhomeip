name: Build Matter Android Libraries

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-dev libgflags-dev libsqlite3-dev \
            ninja-build generate-ninja npm nodejs

      - name: Install Android NDK
        run: |
          # 建议使用项目要求的 NDK 版本，此处以 r25b 为例
          mkdir -p $HOME/android-sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip -d $HOME/android-sdk/ndk
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/android-ndk-r25b" >> $GITHUB_ENV

      - name: Initialize Bootstrap
        run: |
          # 激活 Matter 构建环境
          source scripts/activate.sh

      - name: Generate GN Config & Build
        run: |
          source scripts/activate.sh
          # 使用官方脚本编译 android 平台的库
          ./scripts/build/build_examples.py \
            --target android-arm64-chip-tool \
            build

            
          # # 设置目标架构，这里以 arm64 为例，如果需要 armv7a 请更改为 'arm'
          # TARGET_CPU="arm64"
          
          # # 使用 GN 生成构建目录
          # # 我们指定构建目标为 android
          # gn gen out/android-$TARGET_CPU --args="target_os=\"android\" target_cpu=\"$TARGET_CPU\" android_ndk_root=\"$ANDROID_NDK_HOME\""

          # # 编译指定的动态库
          # # libCHIPController 对应的是 chip-jni
          # # libSetupPayloadParser 对应的是 setup_payload
          # ninja -C out/android-$TARGET_CPU libCHIPController libSetupPayloadParser

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-android-libs
          path: |
            out/android-arm64/lib/libCHIPController.so
            out/android-arm64/lib/libSetupPayloadParser.so
