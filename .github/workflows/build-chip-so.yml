name: Build CHIP Android SO1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git gcc g++ pkg-config ninja-build python3 python3-pip unzip zip curl libssl-dev

    # ✅ 安装 Android NDK
    - name: Setup Android NDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/android-ndk-r25c" >> $GITHUB_ENV

    - name: Clone CHIP
      run: |
        git clone https://github.com/project-chip/connectedhomeip.git
        cd connectedhomeip
        git checkout v1.5.1.0
        git submodule update --init --recursive

    # ✅ 初始化环境（必须）
    - name: Activate build env
      run: |
        cd connectedhomeip
        source scripts/activate.sh

    # 🚫 关键：彻底关闭 Java / Kotlin 编译
    - name: Disable Java build (avoid all Kotlin issues)
      run: |
        cd connectedhomeip

        # 1️⃣ 禁用 Java 相关 GN 引用
        sed -i '/src\/controller\/java/d' BUILD.gn
        sed -i '/src\/app\/server\/java/d' BUILD.gn

        # 2️⃣ 防止 rules.gni assert
        sed -i 's/assert(android_sdk_root.*/# disabled/g' build/chip/java/rules.gni

    # 🚀 编译 Android arm64 so
    - name: Build Android arm64
      run: |
        cd connectedhomeip

        gn gen out/android-arm64 --args='
          target_os="android"
          target_cpu="arm64"
          android_ndk_root="'$ANDROID_NDK_HOME'"
          is_debug=false
          chip_build_tests=false
          chip_build_examples=false
        '

        ninja -C out/android-arm64

    # 📦 输出 so
    - name: Collect .so
      run: |
        mkdir -p output
        find connectedhomeip/out/android-arm64 -name "*.so" -exec cp {} output/ \;

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chip-android-so
        path: output/
