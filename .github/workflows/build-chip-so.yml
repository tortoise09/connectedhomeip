name: Build CHIP Android SO (Minimal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git gcc g++ ninja-build python3 python3-pip unzip curl

      - name: Clone CHIP
        run: |
          git clone https://github.com/project-chip/connectedhomeip.git
          cd connectedhomeip
          git checkout v1.5.1.0
          git submodule update --init --recursive

      # ❗ 不用 bootstrap，不用 CIPD
      - name: Disable Pigweed/CIPD
        run: |
          echo "PW_NO_CIPD=1" >> $GITHUB_ENV
          echo "CHIP_NO_ESP32=1" >> $GITHUB_ENV

      # Android SDK + NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # GN（自己编译，避免 CIPD）
      - name: Install GN
        run: |
          git clone https://gn.googlesource.com/gn
          cd gn
          python3 build/gen.py
          ninja -C out
          echo "$PWD/out" >> $GITHUB_PATH

      # ❗关键：禁用 Java 编译
      - name: Build
        run: |
          cd connectedhomeip

          gn gen out/android-arm64 --args='
            target_os="android"
            target_cpu="arm64"
            android_ndk_root="'$ANDROID_NDK_HOME'"
            is_debug=false

            # 🔥 关键：关闭 Java/Kotlin
            matter_enable_java_compilation=false

            # 🔥 关键：避免一堆平台依赖
            chip_device_platform="linux"
            android_linkflags="-Wl,-z,max-page-size=16384"
          '

          ninja -C out/android-arm64

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: chip-so
          path: |
            connectedhomeip/out/android-arm64/*.so
