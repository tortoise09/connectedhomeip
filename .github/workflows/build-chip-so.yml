name: Build CHIP Android SO (Minimal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      CHIP_VERSION: v1.5.1.0
      NDK_VERSION: 25.2.9519653

    steps:
      - uses: actions/checkout@v4

      # ✅ 1. 缓存源码（含 submodule）
      - name: Cache CHIP source
        uses: actions/cache@v4
        with:
          path: connectedhomeip
          key: chip-src-${{ env.CHIP_VERSION }}

      - name: Clone CHIP (if needed)
        run: |
          if [ ! -d "connectedhomeip" ]; then
            git clone https://github.com/project-chip/connectedhomeip.git
            cd connectedhomeip
            git checkout $CHIP_VERSION
            git submodule update --init --recursive
          fi

      # ✅ 2. 基础依赖（很快）
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git gcc g++ ninja-build python3 python3-pip unzip curl

      # ✅ 先装 JDK（必须在最前）
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      # ✅ 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ 5. 缓存 NDK（关键加速点）
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install NDK (if needed)
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            sdkmanager "ndk;${NDK_VERSION}"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      # ✅ 6. 缓存 GN
      - name: Cache GN
        uses: actions/cache@v4
        with:
          path: gn-out
          key: gn-v1

      - name: Build GN (if needed)
        run: |
          if [ ! -d "gn-out" ]; then
            git clone https://gn.googlesource.com/gn
            cd gn
            python3 build/gen.py
            ninja -C out
            cp -r out ../gn-out
          fi
          echo "$PWD/gn-out" >> $GITHUB_PATH

      # ✅ 7. 缓存 build（命中后直接秒编）
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: connectedhomeip/out
          key: chip-build-${{ runner.os }}-${{ env.CHIP_VERSION }}

      # ✅ 8. 构建（无 Java / 无 CIPD）
      - name: Build CHIP SO
        run: |
          cd connectedhomeip

          gn gen out/android-arm64 --args='
            target_os="android"
            target_cpu="arm64"
            android_ndk_root="'$ANDROID_NDK_HOME'"
            is_debug=false

            # 🔥 关键：关闭 Java/Kotlin（避免编译报错）
            matter_enable_java_compilation=false

            # 🔥 避免复杂平台依赖
            chip_device_platform="linux"
            android_linkflags="-Wl,-z,max-page-size=16384"
          '

          ninja -C out/android-arm64
          
      # ✅ 9. 上传结果
      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: chip-so
          path: |
            connectedhomeip/out/android-arm64/*.so
