name: Build Matter Android Libraries

on:
  workflow_dispatch: # 方便你手动触发测试

jobs:
  build:
    runs-on: ubuntu-22.04
    # 核心：直接使用官方提供的 Android 编译环境镜像
    container:
      image: ghcr.io/project-chip/chip-build-android:35
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build Libraries
        shell: bash  # <--- 强制指定使用 bash，解决 source not found 问题
        run: |
          set -e
          
          echo "===== git config ====="
          # 1. 解决 Git 目录所有权限制 (关键修复)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "===== BEFORE BOOTSTRAP ====="
          # 1. 初始化
          source scripts/bootstrap.sh
          
          echo "===== BEFORE ACTIVATE ====="
          # 2. 🔥 强制加载 Pigweed 环境（关键！！！）
          source .environment/activate.sh

          # 验证python版本
          echo "==== DEBUG PYTHON ===="
          which python3
          python3 --version
          echo "======================"
          
          # 3. 生成 GN 配置 (针对 arm64)
          # 注意：官方镜像中 ANDROID_NDK_HOME 通常已内置
          gn gen out/android-arm64 --args='target_os="android" target_cpu="arm64" android_linkflags="-Wl,-z,max-page-size=16384"'
          
          # 4. 编译你需要的两个特定 so
          ninja -C out/android-arm64 libCHIPController libSetupPayloadParser

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-android-libs
          path: |
            out/android-arm64/lib/libCHIPController.so
            out/android-arm64/lib/libSetupPayloadParser.so
